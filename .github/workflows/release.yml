# 推送 v* 標籤時建置 Windows 安裝檔和 Android APK，建立 GitHub Release 草稿（確認後再按發布）
#   git tag v0.4.0 && git push origin v0.4.0
# 在 Actions 頁面手動執行（workflow_dispatch）時只打包 APK，放在這次執行的 Artifacts，用來測試流程
#
# 需要在 repo 的 Settings → Secrets and variables → Actions 設定：
#   Variables  DESKDO_CF_CLIENT_ID：Cloudflare OAuth client ID（公開用戶端，不是密鑰）
#   Secrets    TAURI_SIGNING_PRIVATE_KEY、TAURI_SIGNING_PRIVATE_KEY_PASSWORD：自動更新的簽章私鑰與密碼
#              （tauri signer generate 產生；公鑰在 tauri.conf.json 的 plugins.updater.pubkey）
#              ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD：APK 的簽名金鑰（.jks 轉 base64）與密碼
#              （別名 deskdo；換了金鑰，已安裝的 App 就無法直接更新，金鑰一定要備份）
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: |
          npm ci --prefix worker
          npm ci --prefix app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESKDO_CF_CLIENT_ID: ${{ vars.DESKDO_CF_CLIENT_ID }}
          # 自動更新的簽章：tauri-action 會一起上傳 latest.json 和 .sig，
          # 發布 Release 後，已安裝的 Deskdo 就會從 releases/latest/download/latest.json 收到更新
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Deskdo ${{ github.ref_name }}
          releaseBody: Windows 下載 `Deskdo_*_x64-setup.exe`，Android 手機下載 `Deskdo_*_arm64.apk` 安裝。第一次開啟時會出現設定精靈。
          releaseDraft: true

  android:
    runs-on: ubuntu-latest
    # 要等上面建立好 Release 草稿才能上傳；手動執行時沒有那一步
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install dependencies
        run: |
          npm ci --prefix worker
          npm ci --prefix app

      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/deskdo.jks"
          echo "DESKDO_KEYSTORE=$RUNNER_TEMP/deskdo.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: app
        env:
          DESKDO_CF_CLIENT_ID: ${{ vars.DESKDO_CF_CLIENT_ID }}
          DESKDO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # runner 內建 Android SDK 和 NDK
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p ../out
          cp src-tauri/gen/android/app/build/outputs/apk/arm64/release/app-arm64-release.apk "../out/Deskdo_${version}_arm64.apk"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: deskdo-apk
          path: out/*.apk

      # 放進同一個 Release 草稿；App 的更新檢查會找 releases/latest 裡的 .apk
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" out/*.apk --clobber
