# 推送 v* 標籤時建置 APK，建立 GitHub Release 草稿（確認後再按發布）
#   git tag v0.7.0 && git push origin v0.7.0
# 在 Actions 頁面手動執行（workflow_dispatch）時只打包 APK，放在這次執行的 Artifacts，用來測試流程
#
# 需要在 repo 的 Settings → Secrets and variables → Actions 設定：
#   Variables  DESKDO_CF_CLIENT_ID：Cloudflare OAuth client ID（公開用戶端，不是密鑰）
#   Secrets    ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD：APK 的簽名金鑰（.jks 轉 base64）與密碼
#              （別名 deskdo；換了金鑰，已安裝的 App 就無法直接更新，金鑰一定要備份）
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          npm ci --prefix upstream/worker
          npm ci

      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/deskdo.jks"
          echo "DESKDO_KEYSTORE=$RUNNER_TEMP/deskdo.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          DESKDO_CF_CLIENT_ID: ${{ vars.DESKDO_CF_CLIENT_ID }}
          DESKDO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # runner 內建 Android SDK 和 NDK
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android build --apk --target aarch64
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p out
          # Linux 上輸出的是 universal 版（--target 只放 arm64），名稱沒有 -unsigned 表示已經簽好
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name '*-release.apk' | head -1)
          test -n "$apk" || { echo "找不到簽好名的 APK"; exit 1; }
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --print-certs "$apk" | grep "CN=Deskdo"
          cp "$apk" "out/Deskdo_${version}_arm64.apk"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: deskdo-apk
          path: out/*.apk

      # App 的更新檢查會找 releases/latest 裡的 .apk
      - name: Create release draft
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" out/*.apk --draft \
            --title "Deskdo Android ${{ github.ref_name }}" \
            --notes "下載 \`Deskdo_*_arm64.apk\` 安裝。第一次開啟時會出現設定精靈。電腦版在 https://github.com/adaizaiganma/deskdo/releases"
