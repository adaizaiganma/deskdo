name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Worker
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm run bundle

      # core 和 desktop 是同一個 npm workspace（根目錄的 package.json）
      - name: Install
        run: npm ci

      - name: Core (shared with Android)
        working-directory: core
        run: npm test

      - name: Desktop (frontend)
        working-directory: desktop
        run: |
          npm run check
          npm test

      # core 的 build.rs 會把上面打包好的 worker/dist/index.js 嵌進 exe
      - name: Desktop and core (Rust)
        working-directory: desktop/src-tauri
        run: cargo test -p deskdo -p deskdo-core
