name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri
            android/src-tauri

      # core、mobile、desktop、web、android 是同一個 npm workspace（根目錄的 package.json）
      - name: Install
        run: npm ci

      - name: Core (shared by desktop, Android and the web version)
        working-directory: core
        run: npm test

      - name: Mobile (shared with Android and the web version)
        working-directory: mobile
        run: |
          npm run check
          npm test

      # 網頁版要先建置，Worker 打包時把它嵌進去
      - name: Web
        working-directory: web
        run: |
          npm run check
          npm run build

      - name: Worker
        working-directory: worker
        run: |
          npm ci
          npm run typecheck
          npm run bundle

      - name: Desktop (frontend)
        working-directory: desktop
        run: |
          npm run check
          npm test

      # core 的 build.rs 會把上面打包好的 worker/dist/index.js 嵌進 exe
      - name: Desktop and core (Rust)
        working-directory: desktop/src-tauri
        run: cargo test -p deskdo -p deskdo-core

      - name: Android (frontend)
        working-directory: android
        run: npx svelte-check --tsconfig ./tsconfig.json

      # 在電腦上檢查 Android 的 Rust（Android 專用的呼叫用 cfg(mobile) 隔開）；真的打包 APK 在 release.yml
      - name: Android (Rust)
        working-directory: android/src-tauri
        run: cargo test
