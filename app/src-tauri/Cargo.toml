[package]
name = "deskdo"
version = "0.6.0"
edition = "2021"

# Android（和 iOS）要把 App 編成函式庫，由系統的 Activity 載入；桌面版的 main.rs 也只是呼叫 run()
[lib]
name = "deskdo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "macros"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tiny-skia = "0.11"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
iana-time-zone = "0.1"
tauri-plugin-opener = "2"
fontdue = "0.9"

# 系統匣、開機啟動、單一執行個體、自動更新只有桌面版有
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", features = ["multipart", "json"] }

# 手機上沒有系統的 OpenSSL，HTTPS 改用 rustls（憑證用內建的 webpki 根憑證）
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls", "charset", "http2"] }

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.6"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
